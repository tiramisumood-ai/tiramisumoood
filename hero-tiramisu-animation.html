<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animation hero tiramisu</title>
    <style>
      :root {
        --cream: #f6ead3;
        --mascarpone: #fff4dc;
        --coffee: #6f4224;
        --biscuit: #c48a4b;
        --cacao: #3a2116;
        --gold: #c6954f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 72% 22%, rgba(198, 149, 79, 0.24), transparent 28rem),
          linear-gradient(135deg, #fff9ee 0%, #ead6b8 48%, #412a1d 100%);
        color: #3a2116;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .hero-tiramisu-demo {
        width: min(100%, 1160px);
        min-height: 560px;
        display: grid;
        grid-template-columns: minmax(280px, 0.92fr) minmax(320px, 1.08fr);
        align-items: center;
        gap: clamp(2rem, 5vw, 5rem);
        padding: clamp(2rem, 6vw, 5rem);
      }

      .hero-copy {
        max-width: 520px;
      }

      .hero-copy p {
        margin: 0 0 1rem;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .hero-copy h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.8rem, 6vw, 5.8rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .hero-copy .lead {
        margin-top: 1.4rem;
        max-width: 34rem;
        font-size: clamp(1rem, 1.7vw, 1.2rem);
        line-height: 1.65;
        color: rgba(58, 33, 22, 0.76);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }

      .tiramisu-stage {
        position: relative;
        width: min(100%, 520px);
        min-height: clamp(390px, 45vw, 560px);
        margin-inline: auto;
        display: grid;
        place-items: center;
        perspective: 1050px;
        touch-action: none;
        user-select: none;
        cursor: grab;
      }

      .tiramisu-stage:active {
        cursor: grabbing;
      }

      .tiramisu-scene {
        position: relative;
        width: clamp(270px, 34vw, 420px);
        aspect-ratio: 0.78;
        transform-style: preserve-3d;
        transform: rotateX(var(--tilt-x, -5deg)) rotateY(var(--tilt-y, 0deg));
        transition: transform 720ms cubic-bezier(0.19, 1, 0.22, 1);
        animation: tiramisuFloat 5.8s ease-in-out infinite;
      }

      .tiramisu-stage.is-dragging .tiramisu-scene {
        transition: transform 80ms linear;
        animation-play-state: paused;
      }

      .verrine-shadow {
        position: absolute;
        left: 50%;
        bottom: 5%;
        width: 74%;
        height: 13%;
        transform: translateX(-50%) translateZ(-120px) rotateX(78deg);
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(50, 28, 17, 0.28), rgba(50, 28, 17, 0.02) 68%);
        filter: blur(10px);
      }

      .verrine {
        position: absolute;
        inset: 6% 10% 13%;
        transform-style: preserve-3d;
        transform: translateZ(20px);
      }

      .glass-body {
        position: absolute;
        inset: 13% 8% 8%;
        overflow: hidden;
        border-radius: 45% 45% 18% 18% / 8% 8% 11% 11%;
        border: 1px solid rgba(255, 255, 255, 0.54);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.06) 18%, rgba(255, 255, 255, 0.03) 52%, rgba(255, 255, 255, 0.26)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.04));
        box-shadow:
          inset 18px 0 28px rgba(255, 255, 255, 0.24),
          inset -22px 0 34px rgba(92, 55, 31, 0.16),
          0 28px 70px rgba(54, 32, 22, 0.25);
        backdrop-filter: blur(1px);
      }

      .glass-rim {
        position: absolute;
        top: 10.5%;
        left: 8%;
        width: 84%;
        height: 16%;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.72);
        background:
          radial-gradient(ellipse at center, rgba(255, 249, 236, 0.16) 0 46%, rgba(95, 63, 39, 0.1) 47%, rgba(255, 255, 255, 0.18) 61%, rgba(255, 255, 255, 0.58) 64%, rgba(255, 255, 255, 0.03) 66%);
        box-shadow:
          inset 0 6px 12px rgba(255, 255, 255, 0.34),
          0 7px 22px rgba(73, 42, 25, 0.16);
        transform: translateZ(38px);
      }

      .layer {
        position: absolute;
        left: 9%;
        right: 9%;
        border-radius: 46% 46% 20% 20% / 24% 24% 14% 14%;
        box-shadow: inset 0 12px 24px rgba(255, 255, 255, 0.18);
      }

      .layer.cacao {
        top: 12%;
        height: 18%;
        background:
          radial-gradient(circle at 22% 38%, rgba(255, 244, 220, 0.2) 0 0.08rem, transparent 0.11rem),
          radial-gradient(circle at 68% 42%, rgba(255, 244, 220, 0.16) 0 0.07rem, transparent 0.1rem),
          radial-gradient(circle at 50% 25%, rgba(255, 244, 220, 0.14) 0 0.06rem, transparent 0.09rem),
          linear-gradient(160deg, #4a2a19, #2b170f 62%, #6e4427);
        filter: saturate(0.92);
      }

      .layer.cream-top {
        top: 24%;
        height: 21%;
        background:
          radial-gradient(ellipse at 38% 16%, rgba(255, 255, 255, 0.58), transparent 42%),
          linear-gradient(180deg, #fff8e5, #efd9af);
      }

      .layer.biscuit-one {
        top: 39%;
        height: 18%;
        background:
          radial-gradient(circle at 28% 58%, rgba(72, 38, 19, 0.34) 0 0.38rem, transparent 0.43rem),
          radial-gradient(circle at 64% 36%, rgba(72, 38, 19, 0.25) 0 0.3rem, transparent 0.35rem),
          linear-gradient(90deg, #9a5b2f, #c7894f 22%, #7a4528 57%, #d49a5d 100%);
      }

      .layer.cream-middle {
        top: 53%;
        height: 22%;
        background:
          radial-gradient(ellipse at 61% 20%, rgba(255, 255, 255, 0.46), transparent 38%),
          linear-gradient(180deg, #fff2d3, #e7c68f);
      }

      .layer.biscuit-two {
        top: 70%;
        height: 18%;
        background:
          radial-gradient(circle at 35% 45%, rgba(66, 34, 19, 0.34) 0 0.36rem, transparent 0.42rem),
          radial-gradient(circle at 74% 56%, rgba(66, 34, 19, 0.24) 0 0.24rem, transparent 0.31rem),
          linear-gradient(90deg, #7d4628, #bb7c42 30%, #5f321e 72%, #c98c52);
      }

      .layer.cream-base {
        top: 84%;
        height: 12%;
        background: linear-gradient(180deg, #f7dfaf, #d6a66a);
      }

      .cream-curve {
        position: absolute;
        left: 13%;
        right: 13%;
        top: 22%;
        height: 9%;
        border-radius: 50%;
        background: rgba(255, 250, 234, 0.72);
        filter: blur(0.5px);
        transform: translateZ(42px);
      }

      .glass-highlight,
      .glass-highlight::after {
        position: absolute;
        content: "";
        pointer-events: none;
      }

      .glass-highlight {
        top: 17%;
        left: 18%;
        width: 13%;
        height: 66%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0.08) 58%, transparent);
        filter: blur(1px);
        transform: translateZ(72px) rotate(6deg);
        animation: glassGlint 4.6s ease-in-out infinite;
      }

      .glass-highlight::after {
        top: 3%;
        left: 340%;
        width: 70%;
        height: 72%;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.34), transparent 64%);
      }

      .gold-glint {
        position: absolute;
        top: 18%;
        right: 18%;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 236, 170, 0.86), rgba(255, 214, 126, 0.05) 64%);
        filter: blur(0.8px);
        transform: translateZ(90px);
        animation: glintDrift 5s ease-in-out infinite;
      }

      .particle {
        position: absolute;
        width: 0.28rem;
        height: 0.28rem;
        border-radius: 50%;
        background: rgba(87, 48, 26, 0.42);
        box-shadow: 0 0 12px rgba(237, 191, 111, 0.55);
        transform: translateZ(112px);
        animation: cocoaFloat 4.8s ease-in-out infinite;
      }

      .particle:nth-child(1) {
        top: 20%;
        left: 27%;
      }

      .particle:nth-child(2) {
        top: 27%;
        right: 24%;
        animation-delay: -1.8s;
        transform: translateZ(128px) scale(0.72);
      }

      .particle:nth-child(3) {
        top: 39%;
        left: 16%;
        animation-delay: -2.7s;
        transform: translateZ(96px) scale(0.62);
      }

      .particle:nth-child(4) {
        top: 48%;
        right: 14%;
        animation-delay: -0.7s;
        transform: translateZ(118px) scale(0.52);
      }

      .spin-hint {
        position: absolute;
        left: 50%;
        bottom: 1.2rem;
        transform: translateX(-50%);
        margin: 0;
        color: rgba(75, 44, 27, 0.7);
        font-size: 0.86rem;
        font-weight: 600;
        letter-spacing: 0;
        white-space: nowrap;
      }

      @keyframes tiramisuFloat {
        0%, 100% {
          translate: 0 0;
        }

        50% {
          translate: 0 -12px;
        }
      }

      @keyframes glassGlint {
        0%, 100% {
          opacity: 0.62;
          translate: 0 0;
        }

        50% {
          opacity: 0.95;
          translate: 14px -5px;
        }
      }

      @keyframes glintDrift {
        0%, 100% {
          opacity: 0.28;
          translate: 0 0;
        }

        45% {
          opacity: 0.9;
          translate: -16px 12px;
        }
      }

      @keyframes cocoaFloat {
        0%, 100% {
          opacity: 0.1;
          translate: 0 0;
        }

        42% {
          opacity: 0.8;
          translate: 10px -18px;
        }
      }

      @media (max-width: 780px) {
        .hero-tiramisu-demo {
          grid-template-columns: 1fr;
          min-height: auto;
          padding: 2rem 1rem 3rem;
          text-align: center;
          gap: 1.5rem;
        }

        .hero-copy {
          margin-inline: auto;
        }

        .hero-copy .lead {
          margin-inline: auto;
        }

        .tiramisu-stage {
          min-height: 390px;
          width: 100%;
        }

        .tiramisu-scene {
          width: min(78vw, 320px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tiramisu-scene,
        .glass-highlight,
        .gold-glint,
        .particle {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero-tiramisu-demo">
      <section class="hero-copy" aria-label="Exemple de placement hero">
        <p>Maison artisanale</p>
        <h1>Tiramisu premium</h1>
        <p class="lead">
          Zone de démonstration uniquement : remplacez votre image hero actuelle par le bloc
          <code>.tiramisu-stage</code> ci-dessous.
        </p>
      </section>

      <section class="tiramisu-stage" aria-label="Tiramisu en verrine interactive">
        <div class="tiramisu-scene">
          <div class="verrine-shadow"></div>
          <div class="verrine">
            <div class="glass-rim"></div>
            <div class="glass-body">
              <div class="layer cacao"></div>
              <div class="layer cream-top"></div>
              <div class="layer biscuit-one"></div>
              <div class="layer cream-middle"></div>
              <div class="layer biscuit-two"></div>
              <div class="layer cream-base"></div>
              <div class="cream-curve"></div>
            </div>
            <div class="glass-highlight"></div>
            <div class="gold-glint"></div>
          </div>
          <span class="particle"></span>
          <span class="particle"></span>
          <span class="particle"></span>
          <span class="particle"></span>
        </div>
        <p class="spin-hint">Faites tourner la verrine</p>
      </section>
    </main>

    <script>
      const stage = document.querySelector(".tiramisu-stage");
      const scene = document.querySelector(".tiramisu-scene");
      let activePointer = null;
      let startX = 0;
      let startY = 0;
      let currentX = -5;
      let currentY = 0;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      const setTilt = (x, y) => {
        currentX = x;
        currentY = y;
        scene.style.setProperty("--tilt-x", `${x}deg`);
        scene.style.setProperty("--tilt-y", `${y}deg`);
      };

      stage.addEventListener("pointerdown", (event) => {
        activePointer = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;
        stage.classList.add("is-dragging");
        stage.setPointerCapture(activePointer);
      });

      stage.addEventListener("pointermove", (event) => {
        if (activePointer !== event.pointerId) return;
        const rect = stage.getBoundingClientRect();
        const rotateY = clamp(((event.clientX - startX) / rect.width) * 44, -22, 22);
        const rotateX = clamp(-5 - ((event.clientY - startY) / rect.height) * 36, -18, 16);
        setTilt(rotateX, rotateY);
      });

      const resetTilt = () => {
        if (activePointer === null) return;
        activePointer = null;
        stage.classList.remove("is-dragging");
        setTilt(-5, 0);
      };

      stage.addEventListener("pointerup", resetTilt);
      stage.addEventListener("pointercancel", resetTilt);
      stage.addEventListener("lostpointercapture", resetTilt);
    </script>
  </body>
</html>
